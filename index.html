<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdstudio</title>
<meta name="description" content="Markdown interpreter and editor.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/hljs.css">
<script defer src="assets/vendor/marked.umd.js"></script>
<script defer src="assets/vendor/purify.min.js"></script>
<script defer src="assets/vendor/highlight.min.js"></script>
<script defer src="assets/js/i18n.js"></script>
<script defer src="assets/js/app.js"></script>
<script defer src="assets/js/github.js"></script>
</head>
<body>
<header class="bar">
  <div class="brand">mdstudio</div>
  <button class="btn only-s" id="btn-tree" type="button" data-i18n="tree.title"></button>
  <div class="group" id="modes" role="group" data-i18n-label="mode.label">
    <button class="btn" type="button" data-mode="editor" data-i18n="mode.editor"></button>
    <button class="btn" type="button" data-mode="split" data-i18n="mode.split"></button>
    <button class="btn" type="button" data-mode="preview" data-i18n="mode.preview"></button>
  </div>
  <div class="group">
    <button class="btn" type="button" id="btn-new" data-i18n="act.new"></button>
    <button class="btn" type="button" id="btn-open" data-i18n="act.open"></button>
    <button class="btn" type="button" id="btn-folder" data-i18n="act.folder"></button>
    <button class="btn" type="button" id="btn-drive" data-i18n="act.drive"></button>
    <button class="btn" type="button" id="btn-todrive" data-i18n="act.todrive"></button>
    <button class="btn" type="button" id="btn-ro" aria-pressed="false" data-i18n="act.ro"></button>
    <span class="sync" id="sync" role="status"></span>
    <button class="btn" type="button" id="btn-auto" aria-pressed="true" data-i18n="act.auto"></button>
    <button class="btn" type="button" id="btn-save" data-i18n="act.save"></button>
    <button class="btn" type="button" id="btn-theme" data-i18n="act.theme"></button>
    <button class="btn" type="button" id="btn-lang" data-i18n-label="act.lang"></button>
  </div>
</header>
<div class="app" id="app" data-mode="split" data-kind="none">
  <aside class="side">
    <div class="side-h" data-i18n="tree.title"></div>
    <nav id="tree" data-i18n-label="tree.title"></nav>
    <div id="dwrap" hidden>
      <div class="side-h"><span data-i18n="act.drive"></span> <button class="btn" type="button" id="btn-glogout" data-i18n="act.logout"></button></div>
      <nav id="dtree" data-i18n-label="act.drive"></nav>
    </div>
    <div id="ghwrap">
      <div class="side-h" data-i18n="gh.title"></div>
      <div class="gh-row"><input class="field" id="gh-url" type="text" inputmode="url" autocomplete="off" spellcheck="false" data-i18n-ph="gh.ph" data-i18n-label="gh.ph"><button class="btn" type="button" id="gh-go" data-i18n="gh.go"></button></div>
      <div class="gh-row">
        <button class="btn" type="button" id="gh-run" data-i18n="gh.run"></button>
        <button class="btn" type="button" id="gh-commit" data-i18n="gh.commit"></button>
        <button class="btn" type="button" id="gh-todrive" data-i18n="gh.todrive"></button>
      </div>
      <details id="gh-tok"><summary data-i18n="gh.token"></summary>
        <div class="gh-row"><input class="field" id="gh-tokin" type="password" autocomplete="off" spellcheck="false" data-i18n-label="gh.token"><button class="btn" type="button" id="gh-tokset" data-i18n="gh.tokset"></button></div>
      </details>
      <div class="side-h" id="gh-rate"></div>
    </div>
  </aside>
  <main class="work">
    <div class="tabs" id="tabs" role="tablist"></div>
    <p class="empty" data-i18n="empty"></p>
    <div class="panes">
      <section class="editor">
        <div class="codewrap pv-dark" id="wrap">
          <pre class="hl" id="hl" aria-hidden="true"><code class="hljs"></code></pre>
          <textarea class="ta" id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" data-i18n-label="editor.label"></textarea>
        </div>
      </section>
      <section class="preview pv-dark" id="pv" data-i18n-label="preview.label">
        <article class="md layout-narrow" id="doc"></article>
        <iframe id="runframe" title="preview" sandbox="allow-scripts allow-forms allow-popups allow-modals" hidden></iframe>
      </section>
    </div>
  </main>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<input type="file" id="file-in" multiple hidden>
</body>
</html>
